name: Release validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validate:
    runs-on: [self-hosted, macOS, count-calories-ios17]
    timeout-minutes: 50
    env:
      SIMULATOR_ID: ${{ vars.IOS17_SIMULATOR_ID }}
      REQUIRED_SIMULATOR_OS_MAJOR: "17"
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-tree production gate
        run: just release-validate
      - name: Retain test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: count-calories-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /private/tmp/count_calories-derived/test-diagnostics
            /private/tmp/count_calories-derived/simulator/Logs/Test
